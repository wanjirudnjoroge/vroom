name: vroom
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  mocktail: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/deer_logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto.ttf

    - family: OpenSans
      fonts:
        - asset: assets/fonts/opensans.ttf
